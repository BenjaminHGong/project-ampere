name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check (bash -n)
        run: |
          set -e
          failure=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "syntax ok: $f"
            else
              echo "syntax FAIL: $f"
              failure=1
            fi
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit "$failure"

      - name: Validate example configs
        run: python3 scripts/validate_configs.py